[workspace]
resolver = "2"
members = [
    "crates/yav",
    "crates/yav-core",
    "crates/yav-macros",
    "crates/yav-router",
    "crates/yav-server",
    "crates/yav-cli",
    "crates/yav-ui",
    "crates/yav-icons",
    "crates/yav-build",
]
exclude = [
    "examples/dashboard",
    "examples/*",
    "demo-app",
    "test-app",
    "test-*",
    "website",
    "website-*",
    "my-app",
]

[workspace.package]
version = "0.1.7"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Isaac Yav <isaacyavs@gmail.com>"]
repository = "https://github.com/isaacvay/yav.rs"
homepage = "https://github.com/isaacvay/yav.rs"
documentation = "https://docs.rs/yav"
# Verified with `cargo +1.88.0 check --workspace --locked`. The locked
# dependency graph (image 0.25.10, icu 2.3, encoding_rs 0.8.42) requires
# rustc 1.88, and Cargo.lock v4 requires Cargo >= 1.78.
rust-version = "1.88"

[workspace.dependencies]
# Internal crates
yav-core = { path = "crates/yav-core", version = "0.1.7" }
yav-macros = { path = "crates/yav-macros", version = "0.1.7" }
yav-router = { path = "crates/yav-router", version = "0.1.7" }
yav-server = { path = "crates/yav-server", version = "0.1.7" }
yav-ui = { path = "crates/yav-ui", version = "0.1.7" }
yav-icons = { path = "crates/yav-icons", version = "0.1.7", default-features = false }
yav-build = { path = "crates/yav-build", version = "0.1.7" }

# External dependencies
axum = "0.8"
clap = { version = "4", features = ["derive"] }
flate2 = "1.0"
futures-util = "0.3"
hyper = "1"
hmac = "0.13"
# Real crypto: WebAuthn ES256 / Web Push VAPID ES256 + RFC 8291 aes128gcm
p256 = { version = "0.14", features = ["ecdsa", "ecdh"] }
aes-gcm = "0.11"
base64 = "0.23"
# Real, scannable QR encoding (pure Rust)
qrcode = "0.15"
# Real image decoding, resizing and lossless WebP encoding (pure Rust)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# CSPRNG for Web Push ephemeral keys and session secrets
rand_core = "0.10"
notify = "9"
notify-debouncer-mini = "0.8"
proc-macro2 = "1"
quote = "1"
# Keep the default features OFF: otherwise reqwest silently adds native-tls /
# OpenSSL alongside rustls, which breaks the "pure Rust, no system TLS" goal.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# Self-update: build into a temporary root, then atomically replace the
# running executable (Windows refuses to overwrite a mapped .exe).
self-replace = "1.5"
tempfile = "3"
subtle = "2.6"
getrandom = "0.4"
syn = { version = "3", features = ["full", "extra-traits"] }
tokio = { version = "1", features = ["full"] }
toml = "1.2"
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "cors", "trace", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Roadmap integrations, all opt-in through member-crate features.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "macros", "migrate"] }
moka = { version = "0.12", features = ["sync"] }
garde = { version = "0.23" }
schemars = { version = "1.2" }
ts-rs = { version = "12.0" }
scraper = { version = "0.29" }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder"] }
argon2 = { version = "0.6" }
oauth2 = { version = "5.0", default-features = false, features = ["reqwest", "rustls-tls"] }
opentelemetry = { version = "0.33" }
opentelemetry_sdk = { version = "0.33", features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-client", "reqwest-rustls", "trace"] }
object_store = { version = "0.14", default-features = false }
pulldown-cmark = { version = "0.13" }
syntect = { version = "5.3" }
uuid = { version = "1.29", features = ["v4"] }
cargo_metadata = { version = "0.23" }
tracing-tree = { version = "0.4" }
fluent-bundle = { version = "0.16" }
unic-langid = { version = "0.9" }

# Test-only tooling.
insta = "1.49"
assert_cmd = "2.2"
trybuild = "1.0"
axum-test = "21.1"
proptest = "1.12"

[profile.dev]

[profile.test]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Keep unwinding: `panic = "abort"` turned any library-level panic (bad manifest,
# poisoned mutex, missing translation key) into a full server process kill.
# Unwinding still terminates the offending request/task without taking the whole
# process down when the panic is caught at a task boundary.
strip = true

