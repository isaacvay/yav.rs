[package]
name = "yav-build"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Build pipeline and Tailwind CSS integration for the Yav web framework"
readme = "../../README.md"
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["build", "tailwind", "assets", "manifest", "yav"]
categories = ["development-tools::build-utils", "web-programming"]

[dependencies]
flate2.workspace = true
tokio.workspace = true
reqwest.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true

scraper = { workspace = true, optional = true }
pulldown-cmark = { workspace = true, optional = true }
syntect = { workspace = true, optional = true }

[dev-dependencies]
insta.workspace = true

[features]
default = []
a11y = ["dep:scraper"]
markdown = ["dep:pulldown-cmark", "dep:syntect"]
