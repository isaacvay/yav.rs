[package]
name = "yav-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core types, rendering engine, and HTML escaping for the Yav web framework"
readme = "../../README.md"
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["web", "framework", "ssr", "vdom", "html"]
categories = ["web-programming", "template-engine"]

[dependencies]
serde_json.workspace = true
fluent-bundle = { workspace = true, optional = true }
unic-langid = { workspace = true, optional = true }

[dev-dependencies]
insta.workspace = true

[features]
default = []
i18n-advanced = ["dep:fluent-bundle", "dep:unic-langid"]
