[package]
name = "yav-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Procedural macros (rsx!, #[component]) for the Yav web framework"
readme = "../../README.md"
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["macros", "rsx", "jsx", "vdom", "yav"]
categories = ["development-tools::procedural-macro-helpers", "web-programming"]

[lib]
proc-macro = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true

[dev-dependencies]
trybuild.workspace = true
# trybuild copies dev-dependencies into its generated project; this makes the
# `rsx!` expansion resolve to `::yav_core` rather than the `yav` facade.
yav-core.workspace = true
