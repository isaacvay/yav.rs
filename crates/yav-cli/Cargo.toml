[package]
name = "yav-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface for the Yav web framework"
readme = "../../README.md"
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["web", "framework", "cli", "scaffold", "ssr"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "yav"
path = "src/main.rs"

[dependencies]
yav-core.workspace = true
yav-server.workspace = true
yav-build.workspace = true
yav-router.workspace = true
# The `yav icon` command needs a populated catalog even when the CLI is built
# on its own (the workspace dependency sets `default-features = false`).
yav-icons = { workspace = true, features = ["classic", "minimal", "system"] }
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
notify.workspace = true
notify-debouncer-mini.workspace = true
reqwest.workspace = true
serde.workspace = true
toml.workspace = true
serde_json.workspace = true
cargo_metadata = { workspace = true, optional = true }
tracing-tree = { workspace = true, optional = true }
self-replace.workspace = true
tempfile.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
insta.workspace = true

[features]
default = []
dx-inspect = ["dep:cargo_metadata", "dep:tracing-tree"]
