[package]
name = "yav-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP server, SSR engine, and middleware for the Yav web framework"
readme = "../../README.md"
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["server", "ssr", "axum", "http", "yav"]
categories = ["web-programming::http-server", "network-programming"]

[dependencies]
yav-core.workspace = true
yav-build.workspace = true
yav-router.workspace = true
axum.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
hmac.workspace = true
sha2.workspace = true
subtle.workspace = true
getrandom.workspace = true
reqwest.workspace = true
p256.workspace = true
aes-gcm.workspace = true
base64.workspace = true
qrcode.workspace = true
image.workspace = true
futures-util.workspace = true
rand_core.workspace = true

# Opt-in roadmap integrations.
sqlx = { workspace = true, optional = true }
moka = { workspace = true, optional = true }
garde = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
ts-rs = { workspace = true, optional = true }
lettre = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }
oauth2 = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
object_store = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
insta.workspace = true
axum-test.workspace = true
proptest.workspace = true

[features]
default = []
sqlite = ["dep:sqlx", "sqlx/sqlite"]
postgres = ["dep:sqlx", "sqlx/postgres"]
durable-jobs = ["dep:sqlx", "sqlx/sqlite"]
tagged-cache = ["dep:moka"]
validation = ["dep:garde"]
schema-codegen = ["dep:schemars", "dep:ts-rs"]
smtp = ["dep:lettre"]
argon2 = ["dep:argon2"]
oauth = ["dep:oauth2"]
otel-sdk = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]
object-storage = ["dep:object_store"]
http-llm = ["dep:uuid"]
all-integrations = [
    "sqlite",
    "postgres",
    "durable-jobs",
    "tagged-cache",
    "validation",
    "schema-codegen",
    "smtp",
    "argon2",
    "oauth",
    "otel-sdk",
    "object-storage",
    "http-llm",
]
