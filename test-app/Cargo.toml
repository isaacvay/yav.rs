[package]
name = "test-app"
version = "0.1.0"
edition = "2021"

[dependencies]
yav = { path = "../crates/yav", features = ["full-icons"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Keep unwinding, matching the workspace release profile: `panic = "abort"`
# would let a panic in request handling kill the whole demo server process.
strip = true
